name: PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-description:
    name: Validate PR Description
    runs-on: ubuntu-latest
    if: github.event.pull_request.body != ''

    steps:
      - name: Check PR description is not empty
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$(echo "$PR_BODY" | tr -d '[:space:]')" ]; then
            echo "❌ PR description is empty. Please describe what changed and why."
            exit 1
          fi

          MIN_LENGTH=50
          BODY_LENGTH=${#PR_BODY}
          if [ "$BODY_LENGTH" -lt "$MIN_LENGTH" ]; then
            echo "❌ PR description is too short ($BODY_LENGTH chars). Minimum is $MIN_LENGTH."
            exit 1
          fi

          echo "✅ PR description looks good ($BODY_LENGTH chars)."

      - name: Verify tests pass in PR description (optional guidance)
        run: |
          if [ "$(echo "$PR_BODY" | grep -c "tests\|testing\|coverage\|#\[x\]" || true)" -lt 1 ]; then
            echo "💡 Tip: Consider mentioning test coverage changes in your PR."
          fi
          echo "✅ Optional guidance step completed."
