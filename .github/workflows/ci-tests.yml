name: CI Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            runtime/sandcastle/package-lock.json
            runtime/sandcastle/package.json

      # Clear npm cache to prevent using stale Node 20 installations
      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install Sandcastle dependencies
        run: npm ci --prefix runtime/sandcastle

      - name: Run tests
        run: make test
        
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.64
          
      - name: Run lint
        run: make lint
