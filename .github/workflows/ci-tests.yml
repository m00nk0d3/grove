name: CI Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test
        
      # Install golangci-lint for lint checks, skipping typecheck due to Go 1.25 compatibility
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.64 # Use older v1.x which has better Go 1.25 support
          
      - name: Run lint
        run: make lint
