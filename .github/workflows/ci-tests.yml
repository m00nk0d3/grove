name: CI Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/sandcastle/package-lock.json

      - name: Install Sandcastle dependencies
        run: npm ci --prefix runtime/sandcastle

      - name: Run tests
        run: make test

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
