name: CI Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint v2.12.2 (Go 1.24+ compatible)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m --build-tags=""

      - name: Initialize Go module
        run: |
          go mod tidy
          echo "Module initialized successfully"

      - name: Verify Go files exist
        run: ls cmd/grove/*.go | head -5

      - name: Run tests
        run: make test
        continue-on-error: false

      - name: Run lint
        run: make lint
        continue-on-error: false

      - name: Verify build succeeds
        run: go build ./...
