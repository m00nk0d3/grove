name: CI Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint (auto-selects Go 1.23 compatible)
        uses: golangci/golangci-lint-action@v3
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run tests
        run: make test
        continue-on-error: false

      - name: Run lint
        run: make lint
        continue-on-error: false

      - name: Verify build succeeds
        run: go build ./...
