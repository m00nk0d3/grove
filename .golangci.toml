version = "2"

[linters]
default = "none"
enable = ["errcheck", "govet", "unused"]

[linters.exclusions]
generated = "lax"
presets = ["comments", "common-false-positives", "legacy", "std-error-handling"]
paths = ["vendor", "runtime/sandcastle", "website/node_modules", "third_party$", "builtin$", "examples$"]

[[linters.exclusions.rules]]
linters = ["unused"]
text = "(switchWorktreeCmd|buildShellCmd|loadCleanupDataCmd|spawnAgentInTerminalWindow|correlateWorktreesWithIssuesAndPRs|exactBranchMatch|containmentMatch|workflowListResponse|escapeForPowerShell) is unused"

[formatters]
enable = ["gofmt", "goimports"]

[formatters.exclusions]
generated = "lax"
paths = ["vendor", "runtime/sandcastle", "website/node_modules", "third_party$", "builtin$", "examples$"]
