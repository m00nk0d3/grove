run:
  timeout: 10m
  
issues:
  exclude-use-default: true
  exclude-dirs:
    - vendor
    - runtime/sandcastle
    - .git
    - dist/
    - node_modules

linters:
  disable-all: true
  enable:
    - gofmt
    - goimports
    - govet
    - unused
    - errcheck
    
  settings:
    typecheck:
      disabled: true

issues:
  exclude-rules:
    # Exclude TypeScript files from Go linters
    - path: 'runtime/sandcastle/src/.*\.ts'
      linters:
        - gofmt
        - goimports
        - govet
        - unused
        - errcheck
