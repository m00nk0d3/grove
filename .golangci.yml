version: "2"
linters:
  enable:
    - govet
    - revive
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gofmt
    - gci
    - godot
formatters:
  enable:
    - goimports
    - gofumpt
    - prettier
  settings:
    goimports:
      local-prefixes:
        - github.com/m00nk0d3/grove
