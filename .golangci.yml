version: "2"

linters:
  default: none
  enable:
    - govet
    - unused
    - errcheck
  exclusions:
    paths:
      - vendor
      - runtime/sandcastle
      - third_party$
      - builtin$
      - examples$
    generated: strict
    rules:
      - path: _test\.go$
        linters:
          - errcheck
      - text: "Error return value of `.*\\.Close` is not checked"
        linters:
          - errcheck
      - text: "Error return value of `.*\\.Unsetenv` is not checked"
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - vendor
      - runtime/sandcastle
