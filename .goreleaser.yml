version: 2

project_name: grove

builds:
  - main: ./cmd/grove
    binary: grove
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -X github.com/m00nk0d3/grove/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: runtime/sandcastle/dist
        dst: runtime/sandcastle/dist
      - src: runtime/sandcastle/package.json
        dst: runtime/sandcastle/package.json
      - src: runtime/sandcastle/README.md
        dst: runtime/sandcastle/README.md

checksum:
  name_template: "checksums.txt"

release:
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
