<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12082a"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <linearGradient id="line-left" x1="16" y1="10" x2="8" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#863bff"/>
      <stop offset="100%" stop-color="#6020cc"/>
    </linearGradient>
    <linearGradient id="line-right" x1="16" y1="10" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#863bff"/>
      <stop offset="100%" stop-color="#00d9ff"/>
    </linearGradient>
    <filter id="glow-purple" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-line" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#863bff" stroke-width="0.75" opacity="0.35"/>

  <!-- Branch lines with glow -->
  <line x1="16" y1="10" x2="8" y2="24" stroke="url(#line-left)" stroke-width="2" stroke-linecap="round" filter="url(#glow-line)"/>
  <line x1="16" y1="10" x2="24" y2="24" stroke="url(#line-right)" stroke-width="2" stroke-linecap="round" filter="url(#glow-line)"/>

  <!-- Top node (HEAD / trunk) — purple -->
  <circle cx="16" cy="10" r="3.2" fill="#863bff" filter="url(#glow-purple)"/>
  <circle cx="16" cy="10" r="1.5" fill="#c28fff"/>

  <!-- Bottom-left node (branch A) — purple dim -->
  <circle cx="8" cy="24" r="2.5" fill="#5a20a8" filter="url(#glow-purple)"/>
  <circle cx="8" cy="24" r="1.2" fill="#9b60ff"/>

  <!-- Bottom-right node (branch B) — cyan -->
  <circle cx="24" cy="24" r="2.5" fill="#00d9ff" filter="url(#glow-cyan)"/>
  <circle cx="24" cy="24" r="1.2" fill="#80ecff"/>
</svg>